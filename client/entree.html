<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>L'Atelier · Entrée</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="page-entree">
  <main class="carte-entree">
    <div class="logo-grand" aria-hidden="true">&lt;/&gt;</div>
    <h1>L'Atelier</h1>
    <p class="sous-titre">Ici, tu codes <strong>ton propre site</strong>. 🚀</p>
    <form id="formulaire-entree" autocomplete="off">
      <label for="code">Ton code d'accès</label>
      <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false"
             placeholder="XXXX-XXXX-XXXX" maxlength="14" required aria-describedby="erreur-entree">
      <p class="erreur" id="erreur-entree" role="alert"></p>
      <button type="submit" class="bouton-principal">Entrer dans l'atelier →</button>
    </form>
    <p class="aide">Pas de code ? Demande-le à ton mentor.</p>
  </main>
  <script type="module" src="/src/eleve/entree.js"></script>
</body>
</html>
