<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion · L'Atelier</title>
<!-- @tete -->
</head>
<body class="page-publique page-connexion">
<!-- @entete -->
  <main id="contenu">
    <div class="formulaire-connexion">
      <p class="etiquette-code">// connexion élève</p>
      <h1>Retrouve ton site</h1>
      <p class="sous-titre">Entre le code que t'a donné ton mentor.</p>
      <form id="formulaire-entree" autocomplete="off">
        <label for="code">Ton code d'accès</label>
        <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false"
               placeholder="XXXX-XXXX-XXXX" maxlength="14" required aria-describedby="erreur-entree aide-code">
        <p class="erreur" id="erreur-entree" role="alert"></p>
        <button type="submit" class="bouton-principal">Entrer dans l'atelier</button>
      </form>
      <p class="aide" id="aide-code">Tu as reçu un lien ? Ouvre-le directement : tu arriveras dans ton atelier sans rien taper. Pas de code ? Demande-le à ton mentor.</p>
    </div>
  </main>
<!-- @pied -->
  <script type="module" src="/src/eleve/entree.js"></script>
</body>
</html>
