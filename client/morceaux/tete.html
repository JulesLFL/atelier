  <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Thème choisi par le visiteur (sinon, celui de son appareil), appliqué avant l'affichage.
    try { var t = localStorage.getItem('atelier:theme'); if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
